<!DOCTYPE html>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans JP', sans-serif; background: #F8FAFC; color: #1E293B; min-height: 100vh; }
header { background: #1E2761; color: white; padding: 3rem 2rem; text-align: center; }
header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
header p { color: #CADCFC; font-size: 1rem; }
.container { max-width: 900px; margin: 0 auto; padding: 2rem; }
.report-card {
  background: white; border-radius: 12px; padding: 2rem;
  margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border-left: 4px solid #1E2761; transition: transform 0.2s;
}
.report-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
.report-card h2 { font-size: 1.3rem; margin-bottom: 0.5rem; }
.report-card .date { color: #64748B; font-size: 0.85rem; margin-bottom: 0.75rem; }
.report-card .desc { color: #475569; font-size: 0.95rem; line-height: 1.7; margin-bottom: 1rem; }
.report-card .tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tag { background: #EEF2FF; color: #1E2761; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; }
.btn {
  display: inline-block; background: #1E2761; color: white; padding: 0.6rem 1.5rem;
  border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 700;
}
.btn:hover { background: #2D3A80; }
footer { text-align: center; padding: 2rem; color: #94A3B8; font-size: 0.85rem; }

<body>
